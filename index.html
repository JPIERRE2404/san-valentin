<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿Quieres ser mi San Valentín? 💖</title>

<style>
:root{
  --pink:#ff2e63;
  --pink2:#ff6fa3;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:linear-gradient(135deg,#ff4e8a,#ff8fb1);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:15px;
}

.container{
  background:white;
  padding:20px;
  border-radius:20px;
  text-align:center;
  width:100%;
  max-width:550px;
  box-shadow:0 15px 40px rgba(0,0,0,.2);
}

h1{
  color:var(--pink);
  margin-bottom:10px;
}

/* ===== CARRUSEL ===== */
.carousel{
  position:relative;
  overflow:hidden;
  border-radius:15px;
  margin:15px 0;
}

.track{
  display:flex;
  transition:transform 0.4s ease;
}

.slide{
  min-width:100%;
}

.slide img{
  width:100%;
  height:350px;
  object-fit:cover;
  border-radius:15px;
}

/* Flechas */
.arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  background:white;
  border:none;
  width:40px;
  height:40px;
  border-radius:50%;
  cursor:pointer;
  font-size:18px;
  font-weight:bold;
  box-shadow:0 5px 15px rgba(0,0,0,.2);
}

#prev{ left:10px; }
#next{ right:10px; }

/* Dots */
.dots{
  display:flex;
  justify-content:center;
  margin-top:10px;
  gap:8px;
}

.dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:#ccc;
  cursor:pointer;
}

.dot.active{
  background:var(--pink);
}

/* Botones */
.buttons{
  margin-top:20px;
  position:relative;
  height:100px;
}

button{
  padding:12px 20px;
  border:none;
  border-radius:30px;
  font-size:16px;
  cursor:pointer;
  position:absolute;
  font-weight:bold;
}

#yesBtn{
  left:30%;
  background:var(--pink);
  color:white;
}

#noBtn{
  right:30%;
  background:#ddd;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-box{
  background:white;
  padding:30px;
  border-radius:20px;
  text-align:center;
}
</style>
</head>

<body>

<div class="container">
  <h1>¿Quieres ser mi San Valentín? 💖</h1>

  <!-- CARRUSEL -->
  <div class="carousel">
    <div class="track" id="track">
      <div class="slide"><img src="img/foto1.jpeg"></div>
      <div class="slide"><img src="img/foto2.jpeg"></div>
      <div class="slide"><img src="img/foto3.jpeg"></div>
      <div class="slide"><img src="img/foto4.jpeg"></div>
      <div class="slide"><img src="img/foto5.jpeg"></div>
    </div>

    <button class="arrow" id="prev">&#10094;</button>
    <button class="arrow" id="next">&#10095;</button>
  </div>

  <div class="dots" id="dots"></div>

  <div class="buttons">
    <button id="yesBtn">¡Sí! 💘</button>
    <button id="noBtn">No 😢</button>
  </div>
</div>

<!-- MODAL FINAL -->
<div class="modal" id="modal">
  <div class="modal-box">
    <h2>¡Sabía que dirías que sí! 💞</h2>
    <p>Ahora oficialmente tenemos cita 😌✨</p>
    <button onclick="closeModal()">Cerrar</button>
  </div>
</div>

<script>
const track = document.getElementById("track");
const slides = document.querySelectorAll(".slide");
const dotsContainer = document.getElementById("dots");
let index = 0;

// Crear dots
slides.forEach((_,i)=>{
  const dot = document.createElement("div");
  dot.classList.add("dot");
  if(i===0) dot.classList.add("active");
  dot.addEventListener("click",()=>goToSlide(i));
  dotsContainer.appendChild(dot);
});

function updateCarousel(){
  track.style.transform = `translateX(-${index*100}%)`;
  document.querySelectorAll(".dot").forEach((d,i)=>{
    d.classList.toggle("active", i===index);
  });
}

function goToSlide(i){
  index=i;
  updateCarousel();
}

document.getElementById("next").addEventListener("click",()=>{
  index=(index+1)%slides.length;
  updateCarousel();
});

document.getElementById("prev").addEventListener("click",()=>{
  index=(index-1+slides.length)%slides.length;
  updateCarousel();
});

// Auto play
setInterval(()=>{
  index=(index+1)%slides.length;
  updateCarousel();
},3000);

// Botón NO se mueve
const noBtn=document.getElementById("noBtn");
let tries=0;

noBtn.addEventListener("mouseover",()=>{
  tries++;
  const x=Math.random()*200;
  const y=Math.random()*50;
  noBtn.style.left=x+"px";
  noBtn.style.top=y+"px";
});

// Botón SI
document.getElementById("yesBtn").addEventListener("click",()=>{
  document.getElementById("modal").style.display="flex";
});

function closeModal(){
  document.getElementById("modal").style.display="none";
}
</script>

</body>
</html>
